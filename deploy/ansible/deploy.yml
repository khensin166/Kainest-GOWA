---
- name: Kainest GOWA - Deploy & Force Update
  hosts: webservers
  become: yes
  vars:
    project_dir: /opt/kainest-gowa
    # Variabel target_image dan webhook_url diinjeksi dari GitHub Actions saat runtime
  tasks:
    - name: Membuat folder proyek di server target
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Menyalin file docker-compose.deploy.yml ke server target
      copy:
        src: ../../docker-compose.deploy.yml
        dest: "{{ project_dir }}/docker-compose.yml"

    - name: Generate file .env di server target
      copy:
        content: |
          TARGET_IMAGE={{ target_image }}
          WEBHOOK_URL={{ webhook_url }}
          GOWA_BASIC_AUTH_USER={{ gowa_user | default('admin') }}
          GOWA_BASIC_AUTH_PASS={{ gowa_pass | default('rahasia') }}
          GOWA_PORT={{ gowa_port | default('3000') }}
        dest: "{{ project_dir }}/.env"
        mode: '0600'
      no_log: true
    
    - name: Memastikan jaringan global 'kainest_net' tersedia
      command: docker network create kainest_net
      register: network_result
      failed_when: 
        - network_result.rc != 0
        - "'already exists' not in network_result.stderr"
      changed_when: network_result.rc == 0

    - name: Login ke GitHub Container Registry di server target
      shell: echo "{{ ghcr_token }}" | docker login ghcr.io -u "{{ ghcr_user }}" --password-stdin
      when: ghcr_token is defined and ghcr_token != ""
      no_log: true
      ignore_errors: yes

    - name: Membersihkan image menggantung (menghindari disk penuh)
      command: docker image prune -f
      ignore_errors: yes

    - name: Pull image terbaru Docker Compose
      command: docker compose --progress plain pull
      args:
        chdir: "{{ project_dir }}"
      register: pull_result
      ignore_errors: yes

    - name: Debug Output Pull (Jika Gagal)
      debug:
        msg: "{{ pull_result.stderr_lines | default(pull_result.stderr) }}"
      when: pull_result.rc != 0

    - name: Fail jika Docker Compose Pull Gagal
      fail:
        msg: "Gagal menarik image dari GHCR (Pull error). Periksa akses registry ghcr.io atau kuota penyimpanan VPS."
      when: pull_result.rc != 0

    - name: Hentikan dan hapus container lama milik compose ini
      command: docker compose down --remove-orphans
      args:
        chdir: "{{ project_dir }}"
      ignore_errors: yes

    - name: Paksa hentikan dan hapus SEMUA container Docker yang menduduki port target
      shell: |
        docker ps -q --filter "publish={{ gowa_port | default('3000') }}" | xargs -r docker rm -f
      ignore_errors: yes

    - name: Pastikan container kainest-gowa lama benar-benar bersih
      shell: docker rm -f kainest-gowa || true
      ignore_errors: yes

    - name: Deteksi apakah port target masih ditempati container atau proses lain
      shell: |
        CONTAINER=$(docker ps -q --filter "publish={{ gowa_port | default('3000') }}" | xargs -r docker inspect --format '{{ '{{' }}.Name{{ '}}' }} ({{ '{{' }}.Config.Image{{ '}}' }})')
        if [ -n "$CONTAINER" ]; then
          echo "CONTAINER_CONFLICT: $CONTAINER"
        fi
        PROCESS=$(ss -tulpn | grep ":{{ gowa_port | default('3000') }} " || true)
        if [ -n "$PROCESS" ]; then
          echo "HOST_PROCESS: $PROCESS"
        fi
      register: port_conflict_check
      ignore_errors: yes

    - name: Tampilkan peringatan jika port target masih terpakai oleh layanan lain
      debug:
        msg: "PERINGATAN: Port {{ gowa_port | default('3000') }} masih dipakai oleh: {{ port_conflict_check.stdout_lines }}"
      when: port_conflict_check.stdout != ""

    - name: Memaksa pembaruan (Up) Docker Compose
      command: docker compose --progress plain up -d --force-recreate --remove-orphans
      args:
        chdir: "{{ project_dir }}"
      register: compose_result
      ignore_errors: yes

    - name: Debug Docker Compose Output (Jika Gagal)
      debug:
        msg: "{{ compose_result.stderr_lines | default(compose_result.stderr) }}"
      when: compose_result.rc != 0

    - name: Ambil log container jika startup gagal
      command: docker logs --tail=50 kainest-gowa
      register: container_crash_logs
      when: compose_result.rc != 0
      ignore_errors: yes

    - name: Tampilkan log crash container
      debug:
        msg: "{{ container_crash_logs.stdout_lines | default(container_crash_logs.stdout) }}"
      when: compose_result.rc != 0 and container_crash_logs.stdout is defined

    - name: Fail jika Docker Compose Gagal
      fail:
        msg: "Deployment gagal pada tahapan Docker Compose Up. Periksa log detail di atas."
      when: compose_result.rc != 0

    - name: Hapus image lama yang tidak terpakai (Prune)
      command: docker image prune -f
      ignore_errors: yes

    - name: Verifikasi Container Berjalan
      shell: docker inspect kainest-gowa --format='{{ '{{' }}.State.Status{{ '}}' }}'
      register: container_status
      until: container_status.stdout | replace('"', '') == "running"
      retries: 5
      delay: 3
